[package]
name = "skiff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epic Games web API client, manifest parser and chunked download engine"

[lib]
name = "skiff_core"
path = "src/lib.rs"

# Deliberately dependency-light: no async runtime and no TLS crate. HTTPS is provided by the
# operating system's WinHTTP stack, concurrency by std threads. Every crate below is pure Rust.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha1 = "0.10"
flate2 = "1"
brotli = "7"
hex = "0.4"
aes-gcm = "0.10"
fastrand = "2"

[dev-dependencies]
sha1 = "0.10"
hex = "0.4"
flate2 = "1"
serde_json = "1"
