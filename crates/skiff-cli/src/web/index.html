<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skiff · Epic 游戏下载器</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1f26; --line: #2a3039; --text: #e6e9ef;
    --muted: #8b93a1; --accent: #4c8dff; --ok: #3fbf7f; --warn: #e2b341; --err: #e2585b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }
  main { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; padding: 16px 22px 32px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; }
  input, button, select { font: inherit; }
  input[type=text], input[type=number] {
    background: #12151a; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row > label { color: var(--muted); min-width: 92px; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text); }
  .check input { width: auto; }
  .games { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .group { border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }
  .game { display: flex; align-items: center; gap: 12px; padding: 9px 12px; }
  .game .meta, .dlc-row .meta { flex: 1; min-width: 0; }
  .game .title, .dlc-row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game .sub, .dlc-row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlc-row { display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 34px; background: #171b22; }
  .dlc-row .title { font-weight: 500; font-size: 13px; }
  .dlc-row.sel { background: #202733; }
  .tag { margin-left: 8px; font-size: 10px; font-weight: 600; color: var(--accent);
         border: 1px solid #2f4a7a; border-radius: 10px; padding: 0 7px; }
  .tag.muted { color: var(--warn); border-color: #5a4a22; }
  .bar { height: 10px; background: #0e1116; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4c8dff, #6fb0ff); transition: width .2s; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin-top: 12px; font-size: 13px; }
  .stats span { color: var(--muted); }
  .stats b { font-variant-numeric: tabular-nums; }
  .code { font: 700 22px/1.2 "Consolas", monospace; letter-spacing: 3px; color: var(--accent); }
  .err { color: var(--err); word-break: break-word; }
  .ok { color: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  a { color: var(--accent); }
  .hide { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Skiff</h1>
  <span class="badge" id="account">未登录</span>
  <span class="badge" id="games-count">0 款游戏 · 0 个 DLC</span>
  <span class="spacer"></span>
  <button class="ghost" id="btn-login">登录 Epic</button>
  <button class="ghost" id="btn-refresh">刷新游戏库</button>
</header>

<main>
  <section class="panel">
    <h2>游戏库</h2>
    <div class="row"><input type="text" id="search" placeholder="搜索游戏或 DLC 标题…" /></div>
    <div class="games" id="games"><div class="hint">加载中…</div></div>
  </section>

  <div style="display:flex; flex-direction:column; gap:16px;">
    <section class="panel" id="login-panel">
      <h2>登录</h2>
      <div id="login-idle"><div class="hint">点击右上角「登录 Epic」，用浏览器打开激活页面并输入下面的代码。</div></div>
      <div id="login-wait" class="hide">
        <div class="hint">在浏览器中打开 <a id="login-url" target="_blank" rel="noreferrer">激活页面</a>，输入代码：</div>
        <div class="code" id="login-code">--------</div>
        <div class="hint" id="login-stage">等待确认…</div>
      </div>
      <div id="login-error" class="err hide"></div>
    </section>

    <section class="panel">
      <h2>下载</h2>
      <div class="row"><label>并发线程</label><input type="number" id="concurrency" min="1" max="128" value="16" /></div>
      <div class="row"><label>安装目录</label><input type="text" id="dir" placeholder="留空则用默认目录" /></div>
      <div class="row"><label>追加内容</label>
        <label class="check"><input type="checkbox" id="include-dlc" checked /> 安装主游戏时一并下载 DLC</label>
      </div>
      <div class="row">
        <button id="btn-install" disabled>开始安装</button>
        <button class="ghost" id="btn-cancel" disabled>暂停</button>
      </div>
      <div class="hint" id="dlc-hint">选择游戏后显示其已拥有的 DLC。</div>
      <div class="hint">并发数是硬约束：稳态下在途请求数恰好等于该值。范围 1–128。</div>
    </section>

    <section class="panel">
      <h2>进度</h2>
      <div class="bar"><i id="bar"></i></div>
      <div class="stats" id="stats">
        <div><span>状态</span> <b id="s-state">空闲</b></div>
        <div><span>速度</span> <b id="s-speed">—</b></div>
        <div><span>已下载</span> <b id="s-bytes">—</b></div>
        <div><span>预计剩余</span> <b id="s-eta">—</b></div>
        <div><span>分块</span> <b id="s-chunks">—</b></div>
        <div><span>在途 / 峰值</span> <b id="s-inflight">—</b></div>
      </div>
      <div class="hint" id="job-note"></div>
    </section>
  </div>
</main>

<script>
const TOKEN = "__TOKEN__";
const api = (path) => `/api/${path}${path.includes("?") ? "&" : "?"}t=${TOKEN}`;
const $ = (id) => document.getElementById(id);
let selected = null;
let selectedDlc = 0;
let groups = [];
let orphans = [];
let dlcCount = 0;

function humanBytes(n) {
  if (!n) return "0 B";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0, v = n;
  while (v >= 1024 && i + 1 < u.length) { v /= 1024; i++; }
  return v.toFixed(i ? 2 : 0) + " " + u[i];
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function matches(g, q) {
  return !q || (g.title || "").toLowerCase().includes(q) || (g.app_name || "").toLowerCase().includes(q);
}

function groupMatches(group, q) {
  return matches(group.game, q) || (group.dlc || []).some(d => matches(d, q));
}

function renderGames() {
  const q = $("search").value.trim().toLowerCase();
  const list = groups.filter(g => groupMatches(g, q));
  const orph = orphans.filter(d => matches(d, q));
  $("games-count").textContent = `${groups.length} 款游戏 · ${dlcCount} 个 DLC`;
  if (!list.length && !orph.length) {
    $("games").innerHTML = `<div class="hint">${groups.length ? "没有匹配的游戏" : "游戏库为空，先登录或点击刷新"}</div>`;
    return;
  }
  const html = list.map(g => {
    const base = g.game;
    const count = (g.dlc || []).length;
    const badge = count ? `<span class="tag">DLC ${count}</span>` : "";
    const dlcRows = (g.dlc || []).map(d => `
      <div class="dlc-row ${selected === base.app_name ? "sel" : ""}" data-parent="${esc(base.app_name)}">
        <div class="meta">
          <div class="title">${esc(d.title || d.app_name)}</div>
          <div class="sub">${esc(d.app_name)}</div>
        </div>
        <span class="tag">DLC</span>
      </div>`).join("");
    return `<div class="group">
      <div class="game" data-app="${esc(base.app_name)}">
        <div class="meta">
          <div class="title">${esc(base.title || base.app_name)}${badge}</div>
          <div class="sub">${esc(base.app_name)} · ${esc(base.namespace)}</div>
        </div>
        <button class="ghost" data-app="${esc(base.app_name)}">选择</button>
      </div>
      ${dlcRows}
    </div>`;
  }).join("");
  const orphanHtml = orph.length ? `
    <div class="group">
      <div class="hint" style="padding:8px 12px">未关联 DLC（主游戏不在库中，无法单独安装）</div>
      ${orph.map(d => `<div class="dlc-row" data-orphan="1">
        <div class="meta"><div class="title">${esc(d.title || d.app_name)}</div><div class="sub">${esc(d.app_name)}</div></div>
        <span class="tag muted">未关联</span>
      </div>`).join("")}
    </div>` : "";
  $("games").innerHTML = html + orphanHtml;

  document.querySelectorAll("[data-app]").forEach(el => {
    el.onclick = () => selectGame(el.dataset.app);
  });
  document.querySelectorAll("[data-parent]").forEach(el => {
    el.onclick = () => selectGame(el.dataset.parent);
  });
  document.querySelectorAll("[data-orphan]").forEach(el => {
    el.onclick = () => {
      $("job-note").className = "hint err";
      $("job-note").textContent = "该条目是 DLC，但主游戏不在库中，无法单独安装。";
    };
  });
  applySelection();
}

function selectGame(app) {
  selected = app;
  const group = groups.find(g => g.game.app_name === app);
  selectedDlc = group ? (group.dlc || []).length : 0;
  renderGames();
}

function applySelection() {
  const group = groups.find(g => g.game.app_name === selected);
  $("btn-install").disabled = !group;
  if (!group) {
    $("dlc-hint").textContent = "选择游戏后显示其已拥有的 DLC。";
    $("include-dlc").disabled = true;
    return;
  }
  const count = (group.dlc || []).length;
  selectedDlc = count;
  $("include-dlc").disabled = count === 0;
  $("dlc-hint").textContent = count
    ? `该游戏有 ${count} 个已拥有的 DLC；取消勾选则只安装主游戏。`
    : "该游戏没有已拥有的 DLC。";
  $("job-note").className = "hint";
  $("job-note").textContent = `已选择：${group.game.title || selected}`;
}

async function refreshState() {
  try {
    const r = await fetch(api("state"));
    const s = await r.json();
    $("account").textContent = s.logged_in ? `已登录：${s.display_name || "账号"}` : "未登录";
    $("account").className = "badge " + (s.logged_in ? "ok" : "");
    const login = s.login || {};
    if (login.stage === "waiting") {
      $("login-idle").classList.add("hide");
      $("login-wait").classList.remove("hide");
      $("login-code").textContent = login.user_code || "--------";
      if (login.url) { $("login-url").href = login.url; $("login-url").textContent = login.url; }
      $("login-stage").textContent = "等待浏览器确认…";
    } else if (login.stage === "failed") {
      $("login-error").classList.remove("hide");
      $("login-error").textContent = "登录失败：" + (login.error || "未知错误");
    } else if (login.stage === "done") {
      $("login-wait").classList.add("hide");
      $("login-idle").classList.remove("hide");
      $("login-idle").innerHTML = `<div class="ok">登录成功，游戏库已更新。</div>`;
    }
    if (s.games !== groups.length || s.dlc !== dlcCount) loadLibrary();
    applyJob(s.job);
  } catch (e) {
    $("account").textContent = "服务未响应";
  }
}

function applyJob(job) {
  if (!job) return;
  const pct = job.bytes_total ? Math.min(100, job.bytes_done / job.bytes_total * 100) : 0;
  $("bar").style.width = pct.toFixed(1) + "%";
  $("s-state").textContent = job.running ? "下载中" : (job.finished ? (job.error ? "失败" : "完成") : "空闲");
  $("s-speed").textContent = job.running ? humanBytes(job.speed_bps) + "/s" : "—";
  $("s-bytes").textContent = `${humanBytes(job.bytes_done)} / ${humanBytes(job.bytes_total)}`;
  $("s-eta").textContent = job.eta_secs ? `${Math.round(job.eta_secs)} 秒` : "—";
  $("s-chunks").textContent = `${job.chunks_done} / ${job.chunks_total}`;
  $("s-inflight").textContent = `${job.inflight} / ${job.peak_inflight}`;
  $("btn-cancel").disabled = !job.running;
  $("btn-install").disabled = job.running || !selected;
  if (job.error) { $("job-note").className = "hint err"; $("job-note").textContent = job.error; }
  else if (job.summary) { $("job-note").className = "hint ok"; $("job-note").textContent = job.summary; }
}

async function loadLibrary() {
  try {
    const r = await fetch(api("library"));
    const data = await r.json();
    groups = data.games || [];
    orphans = data.orphan_dlc || [];
    dlcCount = data.dlc_count || 0;
    if (selected && !groups.some(g => g.game.app_name === selected)) selected = null;
    renderGames();
  } catch (e) {
    $("games").innerHTML = `<div class="hint err">读取游戏库失败：${esc(e)}</div>`;
  }
}

$("search").oninput = renderGames;

$("btn-login").onclick = async () => {
  const r = await fetch(api("login"), { method: "POST" });
  const data = await r.json();
  if (!data.ok) { alert(data.error || "无法开始登录"); }
};

$("btn-refresh").onclick = async () => {
  $("games").innerHTML = `<div class="hint">正在刷新游戏库…</div>`;
  const r = await fetch(api("library/refresh"), { method: "POST" });
  const data = await r.json();
  if (!data.ok) { $("games").innerHTML = `<div class="hint err">${esc(data.error)}</div>`; return; }
  loadLibrary();
};

$("btn-install").onclick = async () => {
  if (!selected) return;
  const body = {
    app: selected,
    concurrency: parseInt($("concurrency").value, 10) || 16,
    dir: $("dir").value.trim() || null,
    include_dlc: $("include-dlc").checked,
  };
  const r = await fetch(api("install"), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!data.ok) { $("job-note").className = "hint err"; $("job-note").textContent = data.error; }
  else refreshState();
};

$("btn-cancel").onclick = async () => { await fetch(api("cancel"), { method: "POST" }); };

loadLibrary();
refreshState();
setInterval(refreshState, 700);
</script>
</body>
</html>
