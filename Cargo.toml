[workspace]
resolver = "2"
members = ["crates/skiff-core", "crates/skiff-cli", "apps/skiff-slint"]
exclude = ["tools/cargo-probe", "apps/skiff-gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Skiff contributors"]
description = "Third-party Epic Games library downloader with high-concurrency chunked transfer"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
