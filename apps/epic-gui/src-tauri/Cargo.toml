[package]
name = "epicd-gui"
version = "0.1.0"
edition = "2021"
description = "epicd desktop shell"

[lib]
name = "epicd_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epic-core = { path = "../../../crates/epic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
